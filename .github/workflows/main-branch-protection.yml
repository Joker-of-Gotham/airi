name: Enforce Main Branch Protection

on:
  pull_request:
    branches:
      - main

jobs:
  check-protection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check main branch protection
        uses: actions/github-script@v6
        with:
          script: |
            const res = await github.request('GET /repos/{owner}/{repo}/branches/{branch}/protection', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main'
            });
            if (!res.data.required_status_checks || !res.data.required_pull_request_reviews) {
              core.setFailed('Main branch protection is not fully configured.');
            }
