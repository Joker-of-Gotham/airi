name: Release Pocket (Android)

permissions:
  contents: write
  actions: read

on:
  release:
    types:
      - prereleased
  workflow_dispatch:
    inputs:
      build_only:
        description: Build only (no upload to release)
        required: false
        default: false
        type: boolean
      tag:
        description: Specific tag for the release upload
        required: false
        type: string
  # Disable scheduled runs in forks
  # schedule:
  #   - cron: '0 1 * * *'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      PRODUCT_NAME: 'AIRI'
      # Every current trigger path produces an installable APK artifact, so ship the analytics-enabled build consistently.
      VITE_ENABLE_POSTHOG: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11.0'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;35.0.0"

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Build Android APK
        run: pnpm -F @proj-airi/pocket run build:android

      - name: Upload APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pocket-android-apk
          path: apps/pocket/android/app/build/outputs/apk/release/*.apk

      - name: Get release info
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_only != 'true' }}
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: '${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}'
            });
            return release.id;

      - name: Upload APK to release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_only != 'true' }}
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.get_release.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const apkFiles = fs.readdirSync('apps/pocket/android/app/build/outputs/apk/release')
              .filter(f => f.endsWith('.apk'))
              .map(f => `apps/pocket/android/app/build/outputs/apk/release/${f}`);

            for (const apkFile of apkFiles) {
              const apkName = apkFile.split('/').pop();
              console.log(`Uploading ${apkFile} as ${apkName}`);

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: process.env.RELEASE_ID,
                name: apkName,
                data: fs.readFileSync(apkFile)
              });
            }
